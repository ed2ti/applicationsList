<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col">
                <h2 class="float-start">Applications</h2>
                <div class="float-end">
                    <a href="/newApp" class="btn btn-primary me-2">Add Application</a>
                    <a href="/config" class="btn btn-secondary">Settings</a>
                </div>
            </div>
        </div>

        <div class="row">
            {{range $index, $app := .apps}}
                <div class="col-md-{{divide 12 $.config.CardsPerRow}} mb-4">
                    <div class="card h-100">
                        <img src="/{{$app.Logo}}" class="card-img-top p-3" alt="{{$app.Name}} Logo" style="height: 200px; object-fit: contain;">
                        <div class="card-body">
                            <h5 class="card-title">{{$app.Name}}</h5>
                            <a href="{{$app.Link}}" target="_blank" class="btn btn-primary">Access</a>
                            <form action="/delete/{{$app.ID}}" method="POST" class="d-inline">
                                <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this application?')">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            {{end}}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
