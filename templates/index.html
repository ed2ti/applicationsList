<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-img-top {
            border-radius: 0.375rem;
            object-fit: cover;
            width: 100%;
            height: 150px;
        }
        .card-title {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Application Panel</h1>
        <form action="/add" method="POST" enctype="multipart/form-data" class="mb-4">
            <div class="row">
                <div class="col-md-4">
                    <input type="text" name="name" placeholder="Application Name" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <input type="file" name="logo" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <input type="text" name="link" placeholder="Application Link" class="form-control" required>
                </div>
                <div class="col-md-2 mt-2">
                    <button type="submit" class="btn btn-primary">Add Application</button>
                </div>
            </div>
        </form>
        <div class="row">
            {{ range .apps }}
            <div class="col-md-4 mb-3">
                <a href="{{ .Link }}" target="_blank" class="text-decoration-none">
                    <div class="card">
                        <img src="/{{ .Logo }}" class="card-img-top" alt="{{ .Name }}">
                        <div class="card-body">
                            <h5 class="card-title">{{ .Name }}</h5>
                        </div>
                    </div>
                </a>
                <form action="/delete/{{ .ID }}" method="POST" class="mt-2">
                    <button type="submit" class="btn btn-danger w-100">Delete</button>
                </form>
            </div>
            {{ end }}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
