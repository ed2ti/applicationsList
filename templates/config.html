<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Configuration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col">
                <h2>System Configuration</h2>
                <a href="/" class="btn btn-secondary">Back to Applications</a>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <form action="/saveConfig" method="POST" class="card p-4">
                    <div class="mb-3">
                        <label for="cardsPerRow" class="form-label">Cards per Row</label>
                        <select class="form-select" id="cardsPerRow" name="cardsPerRow" required>
                            <option value="2" {{if eq .Config.CardsPerRow 2}}selected{{end}}>2 Cards</option>
                            <option value="3" {{if eq .Config.CardsPerRow 3}}selected{{end}}>3 Cards</option>
                            <option value="4" {{if eq .Config.CardsPerRow 4}}selected{{end}}>4 Cards</option>
                            <option value="5" {{if eq .Config.CardsPerRow 5}}selected{{end}}>5 Cards</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Configuration</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
